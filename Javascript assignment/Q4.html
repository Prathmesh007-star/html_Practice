<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print all the multiplication tables with numbers from 2 to 10</h1>
    <p id="demo"></p>

    <script>
        let number='';
        for(let num=2; num<=10; num++){
            number+=`<h3>multiplication table of ${num}:</h3>`;
            for(let i=1;i<=10;i++){
                number+=`${num}X${i}=${num*i} <br>`;
                console.log(i);

            }
            number+=`<br>`;
        }
        document.getElementById("demo").innerHTML+=number;
    </script>
</body>
</html>
