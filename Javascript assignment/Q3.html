<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print the multiplication table of 7</h1>
    <p id="demo"></p>

    <script>
        let table=7;
        for(let i=1;i<=10;i++){
            table=`7 + ${i} = ${7*i} <br>`;
            console.log(table);
            document.getElementById("demo").innerHTML+=table;
        }
    </script>
</body>
</html>
