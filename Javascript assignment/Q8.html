<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Q8 Calculate the sum of numbers in an array of numbers. (Take a minimum of 8 numbers in the array).</h1>
    <p id="demo"></p>
    <script>
        let numbers=[1,2,3,4,5,6,7,8];
        let sum=0;

        for(let i=0 ; i<numbers.length ; i++){
            sum+=numbers[i];
            console.log(sum);
        }
        document.getElementById("demo").innerHTML=sum;
    </script>
</body>
</html>
