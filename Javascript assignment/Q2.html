<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print the odd numbers less than 100</h1>
    <P id="demo"></P>
    
    <script>
        let numbers='';
        for(let i=1;i<=100;i+=2){
            numbers+=i+'<br>';
            console.log(i);

            document.getElementById("demo").innerHTML=numbers;
        }
    </script>
</body>
</html>
