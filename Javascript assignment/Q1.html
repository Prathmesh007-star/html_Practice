<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print numbers 1 to 10</h1>
    <p id="demo"></p>

    <script>
        let numbers='';
        for(let i=0;i<=10;i++){
            numbers= i+'<br>' ;
            console.log(i);
            document.getElementById("demo").innerHTML+=numbers;
        }
    </script>
</body>
</html>
