<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculate 10! (Factorial of 10).</h1>
    <p id="demo"></p>
    <script>
        let factorial =1;
        for(let i=1; i<=10 ; i++){
            factorial*=i;
            console.log(factorial);
        }
        document.getElementById("demo").innerHTML = factorial;
    </script>
</body>
</html>
